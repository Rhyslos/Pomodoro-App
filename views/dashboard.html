<div id="dashboard-screen">
    <h1 id="welcome-msg"></h1>
    
    <div class="button-group">
        <button onclick="createSession()">Create New Room</button>
    </div>
    
    <div class="divider"><span>OR</span></div>
    
    <div class="join-group">
        <input type="text" id="roomCodeInput" placeholder="Enter 6-character code (e.g. AB-CDE)">
        <button onclick="joinRoom()">Join Room</button>
    </div>
    
    <button onclick="deleteAccount()" id="delete-btn">Delete Account</button>
</div>
