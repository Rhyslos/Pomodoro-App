<div id="dashboard-screen">
    <h1 id="welcome-msg"></h1>
    
    <div class="button-group">
        <button onclick="openCreateRoomModal()">Create New Room</button>
    </div>
    
    <div class="divider"><span>OR</span></div>
    
    <div class="join-group">
        <input type="text" id="roomCodeInput" placeholder="Enter 6-character code (e.g. AB-CDE)">
        <button onclick="joinRoom()">Join Room</button>
    </div>
</div>

<div id="create-room-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h2>Room Settings</h2>
        
        <div class="form-group">
            <label for="setting-room-name">Room Name</label>
            <input type="text" id="setting-room-name" placeholder="Enter a cool name">
        </div>
        
        <div class="modal-grid">
            <div class="form-group">
                <label for="setting-work-time">Work (min)</label>
                <input type="number" id="setting-work-time" value="25" min="1" max="120">
            </div>
            <div class="form-group">
                <label for="setting-break-time">Short Break (min)</label>
                <input type="number" id="setting-break-time" value="5" min="1" max="60">
            </div>
            <div class="form-group">
                <label for="setting-long-break-time">Long Break (min)</label>
                <input type="number" id="setting-long-break-time" value="15" min="1" max="60">
            </div>
            <div class="form-group">
                <label for="setting-target-sets">Sets Before Long Break</label>
                <input type="number" id="setting-target-sets" value="4" min="1" max="10">
            </div>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="setting-auto-start">
            <label for="setting-auto-start">Auto-start phases</label>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="setting-show-code">
            <label for="setting-show-code">Show Room Code under Room Name</label>
        </div>
        
        <div class="checkbox-group">
            <input type="checkbox" id="setting-debug">
            <label for="setting-debug">Enable Debug Mode (Test Users)</label>
        </div>
        
        <div class="modal-actions">
            <button onclick="closeCreateRoomModal()" class="warning-btn">Cancel</button>
            <button onclick="createSession()" class="success-btn">Create</button>
        </div>
    </div>
</div>
